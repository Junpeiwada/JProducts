<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --ink: #16181d;
  --ink-2: #565b64;
  --ink-3: #8a8f98;
  --line: #e4e4de;
  --lime: #c2d94a;
  --lime-ink: #5b7000;
  --lime-soft: #f1f6d6;
  --font-display: "Space Grotesk", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; }
.logo svg { width: 26px; height: 26px; }
header a.x { font-size: 14px; color: var(--ink-2); text-decoration: none; }
header a.x:hover { color: var(--ink); }

.intro { padding: 72px 0 48px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; color: var(--lime-ink); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-size: clamp(34px, 5.6vw, 60px); line-height: 1.2; letter-spacing: -.02em; margin: 12px 0 16px; word-break: auto-phrase; }
.intro p { color: var(--ink-2); max-width: 620px; margin: 0; font-size: clamp(15px, 1.8vw, 17px); }

.products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.product { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; text-decoration: none; transition: transform .2s, box-shadow .2s; }
.product:hover { transform: translateY(-3px); box-shadow: 0 24px 48px -28px rgba(60, 40, 20, .45); }
.product img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.product .body { padding: 24px 28px 28px; }
.product .tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--lime-ink); background: var(--lime-soft); border-radius: 999px; padding: 2px 10px; }
.product h2 { font-family: var(--font-display); font-size: 26px; margin: 10px 0 6px; letter-spacing: -.01em; }
.product p { margin: 0; color: var(--ink-2); font-size: 15px; }
.product .more { display: inline-block; margin-top: 16px; font-weight: 500; font-size: 14px; }
.product .more::after { content: " →"; color: var(--lime-ink); }
.soon { display: grid; place-items: center; text-align: center; min-height: 320px; border: 1.5px dashed var(--line); border-radius: 24px; color: var(--ink-3); padding: 24px; }
.soon b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--ink-2); margin-bottom: 4px; }

footer.wrap { padding-top: 72px; padding-bottom: 56px; font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .intro { padding: 48px 0 36px; }
  .products { grid-template-columns: 1fr; }
  .product .body { padding: 20px 22px 24px; }
  .soon { min-height: 160px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#16181d"/><rect x="9" y="9" width="14" height="14" rx="3" fill="#c2d94a"/></svg>
      JProducts
    </a>
    <a class="x" href="https://x.com/junpeiwada" target="_blank" rel="noopener">@junpeiwada</a>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div class="eyebrow">Products</div>
    <h1>手元の道具を、<br>自分でつくる。</h1>
    <p>Junpei Wada が個人で設計・製作しているハードウェアです。基板もケースもソフトウェアも、自分で使うために作っています。</p>
  </div>

  <div class="products">
    <a class="product" href="jpknob16/">
      <img src="jpknob16/images/photo-top-1200.jpg" width="1200" height="675" alt="木の机に置いた JP-Knob16。白いケースにキー 10 個、OLED 4 枚、ノブ 16 個が並ぶ">
      <div class="body">
        <span class="tag">USB MIDI CONTROLLER · 開発中</span>
        <h2>JP-Knob16</h2>
        <p>写真から目を離さずに、思ったパラメータにすぐ手が届く。OLED 4 枚・ノブ 16 個・キー 10 個の写真編集用コントローラー。</p>
        <span class="more">詳しく見る</span>
      </div>
    </a>
    <div class="soon">
      <div><b>Coming soon</b>次のものを作っています。</div>
    </div>
  </div>
</main>

<footer class="wrap">
  <span>© 2026 Junpei Wada</span>
  <span>お問い合わせは X（<a href="https://x.com/junpeiwada" target="_blank" rel="noopener">@junpeiwada</a>）へ</span>
</footer>

</body>
</html>
